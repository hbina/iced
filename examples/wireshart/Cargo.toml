[package]
name = "wireshart"
version = "0.1.0"
authors = ["Songtronix <contact@songtronix.com>", "Folyd <lyshuhow@gmail.com>"]
edition = "2021"
publish = false

[dependencies]
async-std = "1.13.0"
etherparse = "0.16.0"
iced.features = ["tokio"]
